# Configuração do Netlify — site estático (sem build)
[build]
  publish = "."
  command = ""

# Cabeçalhos de cache: assets podem ser cacheados; HTML sempre revalida
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
